type Agent @entity {
  id: ID!
  agentId: BigInt!
  owner: Bytes!
  agentWallet: Bytes!
  agentURI: String
  subscriptionTier: Int!
  subscriptionExpiry: BigInt!
  isActive: Boolean!
  registeredAt: BigInt!
  updatedAt: BigInt!

  name: String
  description: String
  image: String
  category: String
  skills: [String!]!
  languages: [String!]!

  metadata: [AgentMetadata!]! @derivedFrom(field: "agent")
  payments: [Payment!]! @derivedFrom(field: "agent")
  feedback: [Feedback!]! @derivedFrom(field: "agent")
  validations: [Validation!]! @derivedFrom(field: "agent")

  feedbackCount: Int!
  averageRating: BigDecimal!
  validationCount: Int!
  validationScore: BigDecimal!
}

type AgentMetadata @entity {
  id: ID!
  agent: Agent!
  key: String!
  value: Bytes!
  setAt: BigInt!
}

type Payment @entity {
  id: ID!
  agent: Agent!
  payer: Bytes!
  amount: BigInt!
  tier: Int!
  transactionHash: Bytes!
  timestamp: BigInt!
  verified: Boolean!
}

type Subscription @entity {
  id: ID!
  agent: Agent!
  tier: Int!
  startedAt: BigInt!
  expiresAt: BigInt!
  isActive: Boolean!
}

type Feedback @entity {
  id: ID!
  agent: Agent!
  clientAddress: Bytes!
  feedbackIndex: BigInt!
  value: BigInt!
  valueDecimals: Int!
  tag1: String
  tag2: String
  endpoint: String
  feedbackURI: String
  feedbackHash: Bytes
  isRevoked: Boolean!
  timestamp: BigInt!
}

type Validation @entity {
  id: ID!
  requestHash: Bytes!
  agent: Agent!
  validator: Bytes!
  requestURI: String
  response: Int
  responseURI: String
  responseHash: Bytes
  tag: String
  timestamp: BigInt!
}

type ReputationSummary @entity {
  id: ID!
  agent: Agent!
  totalFeedback: Int!
  totalValue: BigInt!
  averageValue: BigDecimal!
  tag: String
}

type Tier @entity {
  id: ID!
  tierId: Int!
  name: String!
  priceUSDT: BigInt!
  durationDays: Int!
  visibilityBoost: Int!
  connectionLimit: Int!
  hasAPIAccess: Boolean!
  hasAnalytics: Boolean!
  verificationLevel: String!
  subscriberCount: Int!
}

type DailyStats @entity {
  id: ID!
  date: Int!
  totalAgents: Int!
  newAgents: Int!
  totalPayments: BigInt!
  totalFeedback: Int!
  totalValidations: Int!
}

type _Meta_ @entity {
  id: ID!
  blockNumber: Int!
  timestamp: Int!
}
